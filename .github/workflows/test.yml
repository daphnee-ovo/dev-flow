name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dow
        run: cd dow && cargo build --release

      - name: Add dow to PATH
        run: echo "${{ github.workspace }}/dow/target/release" >> $GITHUB_PATH

      - name: Run all tests
        run: bash tests/test_all.sh
