name: Build dow binaries

on:
  push:
    branches: [main]
    paths: ['dow/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dow-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dow-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cd dow
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp dow/target/${{ matrix.target }}/release/dow dist/${{ matrix.artifact }}
          strip dist/${{ matrix.artifact }} 2>/dev/null || true
          chmod +x dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Deploy binaries
        run: |
          mkdir -p scripts/bin
          cp artifacts/dow-linux-x86_64/dow-linux-x86_64 scripts/bin/
          cp artifacts/dow-darwin-arm64/dow-darwin-arm64 scripts/bin/
          chmod +x scripts/bin/dow-*
          cat > scripts/bin/dow <<'EOF'
          #!/usr/bin/env sh
          set -eu

          dir="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64|Linux-amd64)
              exec "$dir/dow-linux-x86_64" "$@"
              ;;
            Darwin-arm64|Darwin-aarch64)
              exec "$dir/dow-darwin-arm64" "$@"
              ;;
            *)
              echo "Unsupported platform: $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          EOF
          chmod +x scripts/bin/dow

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/bin/dow*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update dow platform binaries"
            git push
          fi
