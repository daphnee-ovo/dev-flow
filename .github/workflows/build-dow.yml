name: Build dow binaries

on:
  push:
    branches: [main]
    paths: ['dow/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dow-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dow-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cd dow
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp dow/target/${{ matrix.target }}/release/dow dist/${{ matrix.artifact }}
          strip dist/${{ matrix.artifact }} 2>/dev/null || true
          chmod +x dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

