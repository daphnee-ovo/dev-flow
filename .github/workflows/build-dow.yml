name: Build dow binaries

on:
  push:
    branches: [main]
    paths: ['dow/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dow-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dow-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: dow-darwin-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cd dow
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp dow/target/${{ matrix.target }}/release/dow dist/${{ matrix.artifact }}
          strip dist/${{ matrix.artifact }} 2>/dev/null || true
          chmod +x dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  commit-binaries:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Deploy binaries
        run: |
          cp artifacts/dow-linux-x86_64/dow-linux-x86_64 scripts/bin/
          cp artifacts/dow-darwin-arm64/dow-darwin-arm64 scripts/bin/
          cp artifacts/dow-darwin-x86_64/dow-darwin-x86_64 scripts/bin/
          chmod +x scripts/bin/dow-*
          cp scripts/bin/dow-wrapper scripts/bin/dow
          chmod +x scripts/bin/dow

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/bin/dow*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update dow platform binaries"
            git push
          fi
