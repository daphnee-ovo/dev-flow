name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path dow/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path dow/Cargo.toml
          fi
        shell: bash

      - name: Assemble plugin bundle
        run: bash devtools/assemble.sh all
        shell: bash

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p _package/bin _package/bundle
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            cp dow/target/${{ matrix.target }}/release/dow.exe _package/bin/dow.exe
          else
            cp dow/target/${{ matrix.target }}/release/dow _package/bin/dow
            strip _package/bin/dow 2>/dev/null || true
            chmod +x _package/bin/dow
          fi
          cp -r dist/claude _package/bundle/claude
          cp -r dist/codex _package/bundle/codex
          tar -czf "dow-${TAG}-${{ matrix.platform }}.tar.gz" -C _package .
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: dow-${{ matrix.platform }}
          path: dow-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dow-*.tar.gz
          generate_release_notes: true
