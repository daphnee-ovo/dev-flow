name: Release

env:
  PYTHONUTF8: "1"

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path dow/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path dow/Cargo.toml
          fi
        shell: bash

      - name: Assemble plugin bundle
        run: bash devtools/assemble.sh all
        shell: bash

      - name: Package tarball
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p _package/bin _package/bundle
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            cp dow/target/${{ matrix.target }}/release/dow.exe _package/bin/dow.exe
          else
            cp dow/target/${{ matrix.target }}/release/dow _package/bin/dow
            strip _package/bin/dow 2>/dev/null || true
            chmod +x _package/bin/dow
          fi
          target_count=0
          for target_dir in targets/*; do
            [ -d "$target_dir" ] || continue
            agent="${target_dir##*/}"
            if [ ! -d "dist/${agent}" ]; then
              echo "Missing assembled bundle for target: ${agent}" >&2
              exit 1
            fi
            cp -r "dist/${agent}" "_package/bundle/${agent}"
            target_count=$((target_count + 1))
          done
          if [ "$target_count" -eq 0 ]; then
            echo "No agent targets found under targets/" >&2
            exit 1
          fi
          tar -czf "dow-${TAG}-${{ matrix.platform }}.tar.gz" -C _package .
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: dow-${{ matrix.platform }}
          path: dow-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/dow-*.tar.gz
          generate_release_notes: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          cd npm/dev-flow
          node -e "const p=require('./package.json'); p.version='$TAG'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Publish to npm
        run: cd npm/dev-flow && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^version = \".*\"/version = \"$TAG\"/" dow/Cargo.toml

      - name: Publish to crates.io
        run: cargo publish --manifest-path dow/Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  brew-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"

          SHA_DARWIN_ARM64=$(sha256sum artifacts/dow-${TAG}-darwin-arm64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X86_64=$(sha256sum artifacts/dow-${TAG}-linux-x86_64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_AARCH64=$(sha256sum artifacts/dow-${TAG}-linux-aarch64.tar.gz | cut -d' ' -f1)

          cat > formula.rb <<FORMULA
          class DevFlow < Formula
            desc "Lightweight engineering workflow for Claude Code and Codex CLI agents"
            homepage "https://github.com/daphnee-ovo/dev-flow"
            version "${VER}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/daphnee-ovo/dev-flow/releases/download/${TAG}/dow-${TAG}-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                odie "dev-flow Homebrew package currently provides macOS arm64 only."
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/daphnee-ovo/dev-flow/releases/download/${TAG}/dow-${TAG}-linux-aarch64.tar.gz"
                sha256 "${SHA_LINUX_AARCH64}"
              else
                url "https://github.com/daphnee-ovo/dev-flow/releases/download/${TAG}/dow-${TAG}-linux-x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              if (buildpath/"bin/dow").exist?
                bin.install "bin/dow" => "dow"
              else
                bin.install "dow"
              end
              pkgshare.install "bundle" if (buildpath/"bundle").directory?
            end

            test do
              assert_match "dow", shell_output("#{bin}/dow --version")
            end
          end
          FORMULA

          # Remove leading spaces from heredoc
          sed -i 's/^          //' formula.rb

          # Push to homebrew-tap repo
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/daphnee-ovo/homebrew-tap.git" tap
          cp formula.rb tap/Formula/dev-flow.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dev-flow.rb
          git commit -m "dev-flow ${VER}"
          git push
