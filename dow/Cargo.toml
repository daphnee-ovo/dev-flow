[package]
name = "dev-flow"
version = "0.3.6"
edition = "2021"
description = "Engineering discipline for coding agents — lightweight lifecycle management from requirements through delivery"
license = "MIT"
repository = "https://github.com/daphnee-ovo/dev-flow"
homepage = "https://github.com/daphnee-ovo/dev-flow"
authors = ["xinyue"]
keywords = ["dev-flow", "workflow", "agents", "project-management", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "dow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "0.8"
sha2 = "0.10"
dialoguer = "0.11"
flate2 = "1.0"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = { version = "8", features = ["compression"] }
notify = "7"
notify-debouncer-mini = "0.5"
open = "5"
mime_guess = "2"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
serial_test = "3"
