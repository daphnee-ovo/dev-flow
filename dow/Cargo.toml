[package]
name = "dow"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
toml = "0.8"
dialoguer = "0.11"
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[[test]]
name = "test_dow_status_read"
path = "../tests/test_dow_status_read.rs"

[[test]]
name = "test_dow_status_write"
path = "../tests/test_dow_status_write.rs"

[[test]]
name = "test_dow_validate"
path = "../tests/test_dow_validate.rs"

[[test]]
name = "test_dow_scan"
path = "../tests/test_dow_scan.rs"

[[test]]
name = "test_dow_doc"
path = "../tests/test_dow_doc.rs"

[[test]]
name = "test_dow_branch"
path = "../tests/test_dow_branch.rs"
